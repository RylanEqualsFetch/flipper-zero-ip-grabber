<!DOCTYPE html>
<html>
<body>
  <h1 id="status">Loading...</h1>

  <script>
    fetch("/.netlify/functions/hit" + location.search)
      .then(res => res.json())
      .then(data => {
        document.getElementById("status").textContent =
          "Your IP is: " + data.ip;
      });
  </script>
</body>
</html>
