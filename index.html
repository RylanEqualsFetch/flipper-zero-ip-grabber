<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlipGrabber</title>
</head>
<body>
  <h1 id="status">Loading...</h1>

  <script>
    fetch("/.netlify/functions/hit" + location.search)
      .then(res => res.json())
      .then(data => {
        document.getElementById("status").innerHTML =
          "IP: " + data.ip + "<br>" +
          "OS: " + data.os;
      })
      .catch(err => {
        document.getElementById("status").textContent =
          "Error loading data";
      });
  </script>
</body>
</html>
